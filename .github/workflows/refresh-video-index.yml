name: Refresh video index

on:
  schedule:
    # Every 6 hours. YOUTUBE_API_KEY must be set as a repo secret for this
    # to do anything -- see README.md "Related videos (optional)".
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # src/video_index.py imports numpy/faiss/fastembed at module level
          # (only the embedding *model* download is lazy), so the full
          # backend dependency set is needed just to import it, even though
          # this workflow never constructs a VideoIndex.
          pip install -r backend/requirements.txt
      - name: Refresh data/video_index.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY secret is not set -- skipping refresh. See README.md."
            exit 0
          fi
          python scripts/refresh_video_index.py
      - name: Commit updated index if it changed
        run: |
          if git diff --quiet -- data/video_index.json; then
            echo "No changes to data/video_index.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/video_index.json
          git commit -m "Refresh video index"
          git push
